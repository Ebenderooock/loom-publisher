name: Verify publishing credential

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: github.repository == 'Ebenderooock/loom-publisher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-publish
    steps:
      - name: Verify PAT identity, scopes and package write access without publishing
        env:
          REGISTRY_USERNAME: ${{ vars.GHCR_PUBLISH_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          username = os.environ["REGISTRY_USERNAME"]
          password = os.environ["REGISTRY_PASSWORD"]
          if not username or not password:
              raise SystemExit("Publishing username and environment PAT are required.")

          def send(request):
              try:
                  return urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  error.close()
                  raise SystemExit(
                      "Credential check failed: HTTP " + str(error.code) +
                      " at " + urllib.parse.urlsplit(error.url).path
                  ) from None

          request = urllib.request.Request(
              "https://api.github.com/user",
              headers={
                  "Authorization": "Bearer " + password,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "loom-publisher-credential-check",
              },
          )
          with send(request) as response:
              identity = json.load(response)["login"]
              scopes = {
                  scope.strip()
                  for scope in response.headers.get("X-OAuth-Scopes", "").split(",")
                  if scope.strip()
              }
          if identity.casefold() != username.casefold():
              raise SystemExit("PAT owner does not match GHCR_PUBLISH_USERNAME.")
          if ("write:packages" not in scopes or
                  scopes - {"write:packages", "read:packages"}):
              raise SystemExit(
                  "Use a classic PAT with only write:packages (and implied read), "
                  "not broader scopes. Reported scopes: " + ", ".join(sorted(scopes))
              )
          print("PASS: PAT identity and package-only scopes verified.")

          origin = "https://ghcr.io"
          package = "ebenderooock/loom"
          query = urllib.parse.urlencode({
              "service": "ghcr.io",
              "scope": "repository:" + package + ":pull,push",
          })
          credentials = base64.b64encode((username + ":" + password).encode()).decode()
          request = urllib.request.Request(
              origin + "/token?" + query,
              headers={"Authorization": "Basic " + credentials},
          )
          with send(request) as response:
              registry_token = json.load(response)["token"]
          request = urllib.request.Request(
              origin + "/v2/" + package + "/blobs/uploads/",
              data=b"",
              method="POST",
              headers={"Authorization": "Bearer " + registry_token},
          )
          with send(request) as response:
              if response.status != 202:
                  raise SystemExit("Registry did not authorize an empty upload.")
              location = response.headers.get("Location")
          if not location:
              raise SystemExit("Registry omitted the upload cancellation URL.")
          location = urllib.parse.urljoin(request.full_url, location)
          parsed = urllib.parse.urlsplit(location)
          upload_paths = (
              "/v2/" + package + "/blobs/upload/",
              "/v2/" + package + "/blobs/uploads/",
          )
          if (parsed.scheme != "https" or parsed.netloc != "ghcr.io" or
                  not parsed.path.startswith(upload_paths)):
              raise SystemExit("Registry returned an unexpected cancellation URL.")
          request = urllib.request.Request(
              location,
              method="DELETE",
              headers={"Authorization": "Bearer " + registry_token},
          )
          with send(request) as response:
              if response.status != 204:
                  raise SystemExit("Registry did not cancel the empty upload.")
          print("PASS: PAT can write the production package. Empty upload cancelled; "
                "no image, tag or package version was published.")
          PY
